<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título y descripción: lo que Google muestra en los resultados -->
    <title>Evora | Planificador de eventos y subtareas</title>
    <meta
      name="description"
      content="Evora te ayuda a planificar eventos: crea subtareas, controla tu carga diaria de trabajo, pospón pendientes y mira tu progreso en un solo lugar."
    />
    <meta name="keywords" content="planificador de eventos, organizar eventos, subtareas, gestión de eventos, carga de trabajo, progreso" />
    <meta name="author" content="Evora" />

    <!-- Indexación y dirección oficial de la página -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://TU-DOMINIO.com/" />

    <!-- Iconos y color del navegador en móvil -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#7E22CE" />

    <!-- Open Graph: vista previa al compartir en WhatsApp, Facebook, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Evora" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Evora | Planificador de eventos y subtareas" />
    <meta
      property="og:description"
      content="Planifica tus eventos, organiza subtareas y controla tu carga diaria de trabajo."
    />
    <meta property="og:url" content="https://TU-DOMINIO.com/" />
    <meta property="og:image" content="https://TU-DOMINIO.com/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Evora | Planificador de eventos y subtareas" />
    <meta
      name="twitter:description"
      content="Planifica tus eventos, organiza subtareas y controla tu carga diaria de trabajo."
    />
    <meta name="twitter:image" content="https://TU-DOMINIO.com/og-image.png" />

    <!-- Datos estructurados: le dicen a Google qué tipo de sitio es -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Evora",
        "url": "https://TU-DOMINIO.com/",
        "description": "Aplicación web para planificar eventos, organizar subtareas y seguir el progreso.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": "es"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
